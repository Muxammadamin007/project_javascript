<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    h1{
      font-weight: 200;
      /* normal text */
    }
    h2{
      font-weight: 400;
      /* a bit bold */
    }
    h3{
      font-weight: 600;
      /* bold */
    }
/* font weight is used for making texts bold */
  </style>
</head>
<body>
  <h1>Hello</h1>
  <h2>Hello</h2>
  <h3>Hello</h3>
</body>
</html>
