<!DOCTYPE html>
<html>
<body style="font-family:sans-serif;padding:24px;display:flex;justify-content:center">

  <style>
    .card {
      padding: 24px;
      border-radius: 16px;
      width: 260px;
      background: #f0f4ff;
      border: 2px solid #c8d4f0;
      text-align: center;
      transition: all 0.3s;
    }

    .card.dark {
      background: #1a2340;
      border-color: #3a4a70;
      color: white;
    }

    .avatar {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: #1a56db;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      margin-bottom: 12px;
    }

    button {
      padding: 8px 20px;
      border-radius: 20px;
      cursor: pointer;
      border: 1px solid black;
      margin-top: 14px;
      font-weight: bold;
    }
  </style>

  <div id="card" class="card">
    
    <div class="avatar">👩‍💻</div>

    <h2>Khakimov Mukhammadamin</h2>

    <p>Web Programming Student</p>

    <button id="toggle-btn">Dark Mode</button>

  </div>

  <script>
    // Select card and button
    const card = document.getElementById("card");
    const toggleBtn = document.getElementById("toggle-btn");

    // Add click event
    toggleBtn.addEventListener("click", function () {

      // Toggle dark class
      card.classList.toggle("dark");

      // Change button text
      if (card.classList.contains("dark")) {
        toggleBtn.textContent = "Light Mode";
      } else {
        toggleBtn.textContent = "Dark Mode";
      }

    });
  </script>

</body>
</html>
