
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Joke Generator</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #25243a;
      background: linear-gradient(135deg, #f5f3ff, #e8f0ff);
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    h1 {
      margin-bottom: 12px;
      font-size: clamp(30px, 5vw, 46px);
      color: #5b43c4;
    }

    .subtitle {
      color: #77758b;
      line-height: 1.6;
    }

    .card {
      padding: 32px;
      background: white;
      border-radius: 22px;
      box-shadow: 0 12px 35px #4338ca12;
      margin-bottom: 35px;
    }

    h2 {
      margin-top: 0;
      margin-bottom: 24px;
      color: #39345c;
      font-size: 22px;
    }

    .joke-box {
      padding: 25px;
      background: #f7f5ff;
      border-radius: 16px;
      border: 1px solid #e8e2ff;
      min-height: 140px;
    }

    .setup {
      font-size: 20px;
      font-weight: bold;
      line-height: 1.6;
      color: #39345c;
    }

    .punchline {
      margin-top: 20px;
      padding: 16px;
      background: #e9f9f0;
      border-radius: 12px;
      color: #23734b;
      line-height: 1.7;
    }

    .buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 22px;
    }

    button {
      padding: 13px 20px;
      border: none;
      border-radius: 12px;
      background: #6c50d8;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #5035b5;
      transform: translateY(-2px);
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }

    .favorite-btn {
      background: #ed6b91;
    }

    .favorite-btn:hover {
      background: #d94d78;
    }

    .remove-btn {
      margin-top: 12px;
      padding: 9px 14px;
      background: #fce8ed;
      color: #c23d62;
      font-size: 13px;
    }

    .remove-btn:hover {
      background: #f8d4df;
    }

    .status {
      min-height: 20px;
      margin-bottom: 0;
      color: #5b43c4;
      font-size: 14px;
    }

    .error {
      color: #d32f45;
    }

    .spinner {
      width: 32px;
      height: 32px;
      margin: 20px auto;
      border: 4px solid #e7e1ff;
      border-top-color: #6c50d8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .favorites {
      padding: 10px 0;
    }

    .favorite-item {
      margin-bottom: 15px;
      padding: 22px;
      background: white;
      border-radius: 16px;
      border: 1px solid #e7e3f7;
      box-shadow: 0 5px 20px #4338ca08;
      overflow-wrap: anywhere;
    }

    .favorite-item strong {
      color: #4d3aa6;
      line-height: 1.6;
    }

    .favorite-item p {
      color: #69677c;
      line-height: 1.7;
    }

    @media (max-width: 500px) {
      body {
        padding: 25px 14px;
      }

      .card {
        padding: 20px;
      }

      .joke-box {
        padding: 18px;
      }

      .buttons {
        flex-direction: column;
      }

      .buttons button {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <main>
    <header>
      <h1>😂 Joke Generator</h1>
      <p class="subtitle">
        Need a little happiness? Discover a random joke!
      </p>
    </header>

    <section class="card">
      <h2>✨ Today's Joke</h2>

      <div class="joke-box" aria-live="polite">
        <p class="setup" id="setup">
          Click the button below to discover a joke!
        </p>

        <p class="punchline" id="punchline"></p>

        <div id="spinner" class="spinner" hidden></div>
      </div>

      <div class="buttons">
        <button id="loadBtn">🎲 Get a Joke</button>

        <button id="saveBtn" class="favorite-btn" disabled>
          ❤️ Save Favourite
        </button>
      </div>

      <p id="status" class="status" role="status"></p>
    </section>

    <section class="favorites">
      <h2>❤️ My Favourite Jokes</h2>
      <div id="favoritesList"></div>
    </section>
  </main>

  <script>
    const loadBtn = document.getElementById("loadBtn");
    const saveBtn = document.getElementById("saveBtn");
    const setupEl = document.getElementById("setup");
    const punchlineEl = document.getElementById("punchline");
    const spinner = document.getElementById("spinner");
    const statusEl = document.getElementById("status");
    const favoritesList = document.getElementById("favoritesList");

    let currentJoke = null;

    function getFavorites() {
      try {
        return JSON.parse(
          localStorage.getItem("favoriteJokes") || "[]"
        );
      } catch {
        return [];
      }
    }

    function setLoading(isLoading) {
      loadBtn.disabled = isLoading;
      saveBtn.disabled = isLoading || !currentJoke;
      spinner.hidden = !isLoading;

      if (isLoading) {
        setupEl.textContent = "Finding a funny joke...";
        punchlineEl.textContent = "";
        statusEl.textContent = "";
        statusEl.className = "status";
      }
    }

    async function loadJoke() {
      setLoading(true);
      currentJoke = null;
      saveBtn.disabled = true;

      try {
        const response = await fetch(
          "https://official-joke-api.appspot.com/random_joke"
        );

        if (!response.ok) {
          throw new Error("Could not load a joke.");
        }

        const joke = await response.json();

        if (!joke.setup || !joke.punchline) {
          throw new Error("Incomplete joke data.");
        }

        currentJoke = {
          id: joke.id,
          setup: joke.setup,
          punchline: joke.punchline
        };

        setupEl.textContent = currentJoke.setup;
        punchlineEl.textContent = currentJoke.punchline;
        statusEl.textContent = "Enjoy your joke! 😄";
        saveBtn.disabled = false;

      } catch (error) {
        setupEl.textContent = "Oops! Something went wrong.";
        punchlineEl.textContent =
          "Please check your internet connection and try again.";
        statusEl.textContent = "Unable to load a joke.";
        statusEl.className = "status error";

      } finally {
        spinner.hidden = true;
        loadBtn.disabled = false;
      }
    }

    function saveFavorite() {
      if (!currentJoke) return;

      const favorites = getFavorites();

      const alreadySaved = favorites.some(
        joke => joke.id === currentJoke.id
      );

      if (alreadySaved) {
        statusEl.textContent = "This joke is already saved!";
        return;
      }

      favorites.push(currentJoke);

      try {
        localStorage.setItem(
          "favoriteJokes",
          JSON.stringify(favorites)
        );

        statusEl.textContent = "Added to your favourites! ❤️";
        renderFavorites();

      } catch {
        statusEl.textContent = "Could not save this joke.";
        statusEl.className = "status error";
      }
    }

    function removeFavorite(id) {
      const favorites = getFavorites().filter(
        joke => joke.id !== id
      );

      localStorage.setItem(
        "favoriteJokes",
        JSON.stringify(favorites)
      );

      renderFavorites();
    }

    function renderFavorites() {
      const favorites = getFavorites();
      favoritesList.replaceChildren();

      if (favorites.length === 0) {
        const message = document.createElement("p");
        message.textContent = "No favourite jokes yet. Save one!";
        message.className = "subtitle";
        favoritesList.appendChild(message);
        return;
      }

      favorites.forEach(joke => {
        const item = document.createElement("article");
        item.className = "favorite-item";

        const setup = document.createElement("strong");
        setup.textContent = joke.setup;

        const punchline = document.createElement("p");
        punchline.textContent = joke.punchline;

        const removeBtn = document.createElement("button");
        removeBtn.className = "remove-btn";
        removeBtn.textContent = "Remove Favourite";

        removeBtn.addEventListener("click", () => {
          removeFavorite(joke.id);
        });

        item.append(setup, punchline, removeBtn);
        favoritesList.appendChild(item);
      });
    }

    loadBtn.addEventListener("click", loadJoke);
    saveBtn.addEventListener("click", saveFavorite);

    renderFavorites();
  </script>
</body>
</html>
