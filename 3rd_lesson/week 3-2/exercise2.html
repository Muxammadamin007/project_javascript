<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<style>
  body {
    padding: 40px;
  }

  .card {
    background: white;
    border-radius: 12px;
    padding: 24px;
    width: 240px;
    color: #0f766e;
    font-size: 16px;
    position: absolute;
    transition: all .3s linear;
    img{
      width: 100%;
      height: 100%;

    }
  }
</style>

<title>exercise 2</title>
</head>

<body>

<div class="card" id="card"><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTQfQhT_cdg-9nNrIW8Z7DgJKWxJZbyETq0NypzQNpdYg&s=10" alt=""></div>

<script>
  const card = document.getElementById("card");

  card.addEventListener("mouseover", function() {

    let x = Math.random() * (window.innerWidth - 300);
    let y = Math.random() * (window.innerHeight - 100);
    let number = Math.floor(Math.random() * 100);

    card.style.left = x + "px";
    card.style.top = y + "px";

  });
</script>

</body>
</html>
