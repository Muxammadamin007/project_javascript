
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hero Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; font-family: Arial, sans-serif; background: #fff; color: #202124; }
    main { max-width: 1150px; margin: auto; }
    header { text-align: center; margin-bottom: 25px; }
    h1 { font-size: 34px; letter-spacing: -1px; }
    .muted { color: #6b7280; line-height: 1.6; }
    .search { display: flex; gap: 10px; max-width: 600px; margin: 25px auto; }
    input { flex: 1; min-width: 0; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    #status { text-align: center; min-height: 24px; color: #6b7280; }
    #heroes { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px; }
    .card { padding: 16px; border: 1px solid #e5e7eb; border-radius: 12px; }
    .card img { width: 100%; height: 250px; object-fit: contain; background: #f8fafc; border-radius: 8px; }
    .card h2 { font-size: 20px; }
    .card p { color: #6b7280; font-size: 14px; line-height: 1.6; }
    @media (max-width: 520px) { .search { flex-direction: column; } }
  </style>
</head>
<body>
<main>
  <header>
    <p class="muted">WEEK 06 / TASK 05</p>
    <h1>Hero Explorer</h1>
    <p class="muted">Explore superheroes and their abilities.</p>
  </header>

  <form class="search" id="searchForm">
    <input id="heroInput" type="search" placeholder="Search Spider-Man..." autocomplete="off">
    <button type="submit">Search</button>
  </form>

  <p id="status" role="status">Loading heroes...</p>
  <section id="heroes"></section>
</main>

<script>
  const heroesContainer = document.getElementById("heroes");
  const heroInput = document.getElementById("heroInput");
  const status = document.getElementById("status");
  const searchForm = document.getElementById("searchForm");
  let allHeroes = [];

  async function getHeroes() {
    status.textContent = "Loading heroes...";
    try {
      const response = await fetch(
        "https://akabab.github.io/superhero-api/api/all.json"
      );
      if (!response.ok) throw new Error("Could not load heroes.");

      allHeroes = await response.json();
      showHeroes(allHeroes.slice(0, 30));
    } catch (error) {
      status.textContent = "Could not load heroes. Check your connection.";
    }
  }

  function showHeroes(heroes) {
    heroesContainer.replaceChildren();
    status.textContent = heroes.length
      ? heroes.length + " heroes shown"
      : "No heroes found.";

    heroes.forEach(hero => {
      const card = document.createElement("article");
      card.className = "card";

      const image = document.createElement("img");
      image.src = hero.images?.md || hero.images?.sm || "";
      image.alt = hero.name;
      image.loading = "lazy";

      const title = document.createElement("h2");
      title.textContent = hero.name;

      const fullName = document.createElement("p");
      fullName.textContent =
        "Full name: " + (hero.biography?.fullName || "Unknown");

      const publisher = document.createElement("p");
      publisher.textContent =
        "Publisher: " + (hero.biography?.publisher || "Unknown");

      const power = document.createElement("p");
      power.textContent = "Power: " + (hero.powerstats?.power ?? "N/A");

      const intelligence = document.createElement("p");
      intelligence.textContent =
        "Intelligence: " + (hero.powerstats?.intelligence ?? "N/A");

      card.append(image, title, fullName, publisher, power, intelligence);
      heroesContainer.append(card);
    });
  }

  function searchHeroes() {
    const query = heroInput.value.trim().toLowerCase();

    const filtered = allHeroes.filter(hero =>
      hero.name.toLowerCase().includes(query)
    );

    showHeroes(filtered.slice(0, 60));
  }

  searchForm.addEventListener("submit", event => {
    event.preventDefault();
    searchHeroes();
  });

  heroInput.addEventListener("input", searchHeroes);

  getHeroes();
</script>
</body>
</html>
