
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random User Generator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 40px 20px; font-family: Arial, sans-serif; background: #fff; color: #202124; }
    main { max-width: 700px; margin: auto; text-align: center; }
    h1 { font-size: 32px; letter-spacing: -1px; }
    .muted { color: #6b7280; line-height: 1.6; }
    button { padding: 12px 18px; border: 0; border-radius: 8px; background: #2563eb; color: white; cursor: pointer; }
    .card { max-width: 390px; margin: 28px auto; padding: 28px; border: 1px solid #e5e7eb; border-radius: 16px; box-shadow: 0 5px 20px #00000008; }
    .card img { width: 112px; height: 112px; border-radius: 50%; object-fit: cover; border: 4px solid #eff6ff; }
    .card p { overflow-wrap: anywhere; color: #6b7280; }
    #status { min-height: 24px; color: #6b7280; }
  </style>
</head>
<body>
<main>
  <p class="muted">WEEK 06 / TASK 03</p>
  <h1>Random User Generator</h1>
  <p class="muted">Generate a profile using live API data.</p>
  <button id="loadBtn">Get random user</button>
  <p id="status" role="status">Click the button to get started.</p>
  <section class="card" id="userCard">
    <p>Your user profile will appear here.</p>
  </section>
</main>

<script>
  const loadBtn = document.getElementById("loadBtn");
  const status = document.getElementById("status");
  const card = document.getElementById("userCard");

  async function loadUser() {
    loadBtn.disabled = true;
    status.textContent = "Loading user...";
    card.replaceChildren();

    try {
      const response = await fetch("https://randomuser.me/api/");
      if (!response.ok) throw new Error("Could not load user.");

      const data = await response.json();
      const user = data.results[0];

      const image = document.createElement("img");
      image.src = user.picture.large;
      image.alt = "User profile";

      const name = document.createElement("h2");
      name.textContent = `${user.name.first} ${user.name.last}`;

      const email = document.createElement("p");
      email.textContent = user.email;

      const country = document.createElement("p");
      country.textContent = "Country: " + user.location.country;

      const city = document.createElement("p");
      city.textContent = "City: " + user.location.city;

      card.append(image, name, email, country, city);
      status.textContent = "User loaded successfully.";
    } catch (error) {
      card.textContent = "Unable to load user. Please try again.";
      status.textContent = "Something went wrong.";
    } finally {
      loadBtn.disabled = false;
      console.log("Request completed.");
    }
  }

  loadBtn.addEventListener("click", loadUser);
</script>
</body>
</html>
