
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Celebrity Explorer</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 36px 20px; font-family: Arial, sans-serif; background: white; color: #202124; }
    main { max-width: 1150px; margin: auto; }
    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: clamp(28px, 4vw, 38px); letter-spacing: -1px; }
    .muted { color: #6b7280; line-height: 1.6; }
    .search { display: flex; gap: 10px; max-width: 650px; margin: 22px auto; }
    input { flex: 1; min-width: 0; padding: 13px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button { padding: 12px 16px; border: 1px solid #d1d5db; border-radius: 8px; background: white; cursor: pointer; }
    button.primary { background: #2563eb; border-color: #2563eb; color: white; }
    .popular { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin: 18px 0; }
    .popular button { font-size: 13px; }
    #status { min-height: 24px; text-align: center; color: #6b7280; }
    #celebrities { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 18px; }
    .card { border: 1px solid #e5e7eb; border-radius: 12px; overflow: hidden; }
    .card img { width: 100%; height: 190px; object-fit: cover; background: #f3f4f6; }
    .card-content { padding: 16px; }
    .card h2 { font-size: 18px; }
    .card p { font-size: 14px; line-height: 1.6; color: #6b7280; }
    .wiki-link { color: #2563eb; text-decoration: none; font-weight: 600; }
    .hidden { display: none; }
    #loadMore { display: block; margin: 25px auto; }
    @media (max-width: 550px) { .search { flex-direction: column; } .search button { width: 100%; } }
  </style>
</head>
<body>
<main>
  <header>
    <p class="muted">WEEK 06 / TASK 04</p>
    <h1>Celebrity Explorer</h1>
    <p class="muted">Search for famous people and discover their Wikipedia profiles.</p>
  </header>

  <form class="search" id="searchForm">
    <input id="searchInput" type="search" placeholder="Search Messi, Taylor Swift..." required>
    <button class="primary" type="submit" id="searchButton">Search</button>
  </form>

  <div class="popular">
    <button type="button" data-search="Taylor Swift">Taylor Swift</button>
    <button type="button" data-search="Cristiano Ronaldo">Ronaldo</button>
    <button type="button" data-search="Lionel Messi">Lionel Messi</button>
    <button type="button" data-search="Tom Cruise">Tom Cruise</button>
    <button type="button" data-search="Jackie Chan">Jackie Chan</button>
    <button type="button" data-search="MrBeast">MrBeast</button>
  </div>

  <p id="status" role="status">Search for a celebrity to get started.</p>
  <section id="celebrities"></section>
  <button id="loadMore" class="hidden">Load more</button>
</main>

<script>
  const searchForm = document.getElementById("searchForm");
  const searchInput = document.getElementById("searchInput");
  const searchButton = document.getElementById("searchButton");
  const container = document.getElementById("celebrities");
  const status = document.getElementById("status");
  const loadMore = document.getElementById("loadMore");

  let currentQuery = "";
  let currentOffset = 0;
  let isLoading = false;
  let requestNumber = 0;
  const RESULTS_PER_PAGE = 20;

  async function searchCelebrities(query, append = false) {
    query = query.trim();
    if (!query || isLoading) return;

    if (!append) {
      currentQuery = query;
      currentOffset = 0;
      container.replaceChildren();
      loadMore.classList.add("hidden");
    }

    isLoading = true;
    const thisRequest = ++requestNumber;
    searchButton.disabled = true;
    loadMore.disabled = true;
    status.textContent = "Searching Wikipedia...";

    try {
      const params = new URLSearchParams({
        action: "query",
        generator: "search",
        gsrsearch: currentQuery,
        gsrnamespace: "0",
        gsrlimit: String(RESULTS_PER_PAGE),
        gsroffset: String(currentOffset),
        prop: "pageimages|extracts|info",
        piprop: "thumbnail",
        pithumbsize: "400",
        exintro: "1",
        explaintext: "1",
        exsentences: "3",
        inprop: "url",
        redirects: "1",
        format: "json",
        formatversion: "2",
        origin: "*"
      });

      const response = await fetch(
        "https://en.wikipedia.org/w/api.php?" + params
      );
      if (!response.ok) throw new Error("Wikipedia request failed.");

      const data = await response.json();
      if (thisRequest !== requestNumber) return;

      const pages = data.query?.pages || [];
      pages.forEach(page => {
        const card = document.createElement("article");
        card.className = "card";

        if (page.thumbnail?.source) {
          const image = document.createElement("img");
          image.src = page.thumbnail.source;
          image.alt = page.title;
          image.loading = "lazy";
          card.append(image);
        }

        const content = document.createElement("div");
        content.className = "card-content";

        const title = document.createElement("h2");
        title.textContent = page.title;

        const description = document.createElement("p");
        description.textContent = page.extract || "No summary available.";

        const link = document.createElement("a");
        link.className = "wiki-link";
        link.href = page.fullurl ||
          "https://en.wikipedia.org/wiki/" + encodeURIComponent(page.title.replace(/ /g, "_"));
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        link.textContent = "Read on Wikipedia";

        content.append(title, description, link);
        card.append(content);
        container.append(card);
      });

      if (!pages.length && !append) {
        status.textContent = "No results found. Try another search.";
      } else {
        currentOffset += pages.length;
        status.textContent = "Showing " + container.children.length + " results.";
      }

      loadMore.classList.toggle("hidden", pages.length < RESULTS_PER_PAGE);
    } catch (error) {
      status.textContent = "Unable to search Wikipedia. Please try again.";
    } finally {
      isLoading = false;
      searchButton.disabled = false;
      loadMore.disabled = false;
    }
  }

  searchForm.addEventListener("submit", event => {
    event.preventDefault();
    searchCelebrities(searchInput.value);
  });

  document.querySelectorAll("[data-search]").forEach(button => {
    button.addEventListener("click", () => {
      searchInput.value = button.dataset.search;
      searchCelebrities(searchInput.value);
    });
  });

  loadMore.addEventListener("click", () => {
    searchCelebrities(currentQuery, true);
  });
</script>
</body>
</html>
